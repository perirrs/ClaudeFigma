<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: -apple-system, system-ui, sans-serif; width: 320px; margin: 0; padding: 0; background: #0b1016; color: #e6edf3; }
      .header { padding: 12px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #1b2530; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 10px rgba(74,222,128,0.5); }
      .brand { font-size: 13px; font-weight: 700; flex: 1; }
      .header a { font-size: 11px; color: #4ade80; text-decoration: none; }
      .header a:hover { text-decoration: underline; }

      .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #1b2530; }
      .kpi { background: #0b1016; padding: 10px 14px; }
      .kpi-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #8b98a5; margin-bottom: 4px; }
      .kpi-value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }

      .section { padding: 10px 14px; border-top: 1px solid #1b2530; }
      .section-title { font-size: 11px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
      .section-title .tag { font-size: 9px; padding: 2px 6px; border-radius: 3px; font-weight: 600; }

      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .stat { text-align: center; }
      .stat-val { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .stat-label { font-size: 9px; color: #8b98a5; text-transform: uppercase; letter-spacing: 0.05em; }

      .domains { padding: 10px 14px; border-top: 1px solid #1b2530; }
      .domains-title { font-size: 11px; font-weight: 600; margin-bottom: 6px; }
      .domain-row { display: flex; justify-content: space-between; font-size: 11px; padding: 3px 0; }
      .domain-row .name { color: #8b98a5; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .domain-row .time { font-variant-numeric: tabular-nums; margin-left: 10px; }

      .footer { padding: 10px 14px; border-top: 1px solid #1b2530; display: flex; justify-content: space-between; }
      .footer a { font-size: 11px; color: #4ade80; text-decoration: none; cursor: pointer; }
      .footer a:hover { text-decoration: underline; }

      .empty { color: #8b98a5; font-size: 11px; text-align: center; padding: 6px 0; }
      .dept-badge { font-size: 9px; padding: 2px 8px; border-radius: 3px; background: rgba(74,222,128,0.1); color: #4ade80; margin-left: auto; }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="dot"></div>
      <div class="brand">Productivity Analyser</div>
      <a href="#" id="open-dashboard">Full Dashboard</a>
    </div>

    <div class="kpis" id="kpi-grid">
      <div class="kpi"><div class="kpi-label">Active time</div><div class="kpi-value" id="active">0m</div></div>
      <div class="kpi"><div class="kpi-label">Idle time</div><div class="kpi-value" id="idle">0m</div></div>
    </div>

    <div id="platform-sections"></div>

    <div class="domains" id="domains-section">
      <div class="domains-title">Top Domains</div>
      <div id="domains-list"><div class="empty">Browsing data will appear here</div></div>
    </div>

    <div class="footer">
      <a id="export-csv">Export CSV</a>
      <a id="open-settings">Settings</a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
